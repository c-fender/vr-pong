<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1410">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Rooftop Cup Pong</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div id="score">
      <span class="you">YOU <b id="sYou">0</b></span>
      <span id="turn">Your turn</span>
      <span class="cpu"><b id="sCpu">0</b> CPU</span>
    </div>
    <div id="balls" data-n="2"><i></i><i></i></div>
    <div id="toast"></div>
    <div id="hint"></div>
    <div id="tools">
      <button id="btnRecenter" title="Re-center view">◎</button>
      <button id="btnSound" title="Sound">🔊</button>
      <button id="btnMenu" title="Menu">☰</button>
    </div>
  </div>

  <div id="menu">
    <div class="card">
      <h1 id="title">Rooftop Cup Pong</h1>
      <p class="sub">Golden hour. City skyline. Ten cups.</p>
      <div class="row">
        <label>CPU</label>
        <div id="difficulty" class="seg">
          <button data-d="easy">Easy</button>
          <button data-d="medium">Medium</button>
          <button data-d="hard">Hard</button>
        </div>
      </div>
      <div class="row">
        <label for="strength">Throw power</label>
        <input id="strength" type="range" min="0.6" max="1.6" step="0.05" value="1">
      </div>
      <button id="btnPlay" class="primary">Play</button>
      <button id="btnVR" class="vr" hidden>Play in VR</button>
      <p id="hintText" class="hint"></p>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
